name: KidzKorner
options:
  bundleIdPrefix: com.wolfe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
schemes:
  KidzKorner:
    build:
      targets:
        Sully: all
    run:
      config: Debug
targets:
  Sully:
    type: application
    platform: iOS
    sources:
      - Sully
    info:
      path: Sully/Info.plist
      properties:
        NSPhotoLibraryUsageDescription: Kidz Korner needs access to your photo library to create custom matching cards, puzzles, and story characters.
        NSCameraUsageDescription: Kidz Korner uses the camera so you can take selfies for your story characters!
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wolfe.kidzkorner
        INFOPLIST_KEY_CFBundleDisplayName: Kidz Korner
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
